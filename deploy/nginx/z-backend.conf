# Z backend — nginx на ХОСТ-машине. Проксирует на backend-контейнер
# (docker compose, опубликован на 127.0.0.1:3000).
#
# Установка:
#   sudo cp deploy/nginx/z-backend.conf /etc/nginx/sites-available/z-backend.conf
#   sudo ln -s /etc/nginx/sites-available/z-backend.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d api.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ Замени api.example.com.

upstream z_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    # --- TLS (заполняется certbot) ---
    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Аплоады идут на S3 по presigned-URL напрямую; через backend — только JSON (лимит 1mb)
    # + LiveKit-вебхуки. 10m с запасом.
    client_max_body_size 10m;

    location / {
        proxy_pass http://z_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # rawBody для HMAC/LiveKit-подписей не должен буферизоваться/мутироваться.
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # /metrics и /api/docs не публиковать наружу — закрой по IP или убери location.
    location /metrics {
        # allow 10.0.0.0/8; deny all;   # пример: только внутренняя сеть
        proxy_pass http://z_backend;
        proxy_set_header Host $host;
    }
}
