# Z backend — production docker compose.
#
# Поднимает: postgres(pgvector) + redis + migrate(one-shot) + backend(HTTP) + worker(BullMQ).
# Backend слушает только на 127.0.0.1:3000 — наружу его публикует nginx на хост-машине
# (см. deploy/nginx/z-backend.conf).
#
# Запуск (из deploy/backend/):
#   cp backend.env.example backend.env   # заполнить секреты
#   docker compose --env-file backend.env up -d --build
#
# Параметры postgres/redis берутся из backend.env (та же копия, что и app-ENV).

name: z-backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: z-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-z_main}
      POSTGRES_USER: ${POSTGRES_USER:-z_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен в backend.env}
    volumes:
      - z-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-z_app} -d ${POSTGRES_DB:-z_main}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [z-internal]

  redis:
    image: redis:7-alpine
    container_name: z-prod-redis
    restart: unless-stopped
    # appendonly yes — BullMQ-очереди переживают рестарт redis.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - z-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [z-internal]

  # One-shot: схема (prisma db push) + pgvector-индексы (postgres-init.sql).
  # backend/worker стартуют только после успешного завершения.
  migrate:
    image: z-backend:latest
    container_name: z-prod-migrate
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file: [backend.env]
    command:
      - sh
      - -c
      - 'bunx prisma db push --skip-generate && bun scripts/apply-postgres-init.ts'
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [z-internal]

  backend:
    image: z-backend:latest
    container_name: z-prod-backend
    # build на backend — единая сборка образа z-backend:latest, который
    # переиспользуют migrate и worker.
    build:
      context: ../../backend
      dockerfile: Dockerfile
    env_file: [backend.env]
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [z-internal]

  worker:
    image: z-backend:latest
    container_name: z-prod-worker
    command: ['bun', 'dist/workers/main.js']
    env_file: [backend.env]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [z-internal]

volumes:
  z-postgres-data:
  z-redis-data:

networks:
  z-internal:
    driver: bridge
