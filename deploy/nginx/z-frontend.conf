# Z frontend — nginx на ХОСТ-машине. Проксирует на frontend-контейнер
# (Next standalone, bun server.js, опубликован на 127.0.0.1:3001).
#
# Установка:
#   sudo cp deploy/nginx/z-frontend.conf /etc/nginx/sites-available/z-frontend.conf
#   sudo ln -s /etc/nginx/sites-available/z-frontend.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d meet.example.com     # выпустит сертификат и допишет TLS
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ Замени meet.example.com.

upstream z_frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name meet.example.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meet.example.com;

    # --- TLS (заполняется certbot) ---
    # ssl_certificate     /etc/letsencrypt/live/meet.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/meet.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Всё (SSR, middleware, статика, public) обслуживает standalone-сервер в контейнере.
    location / {
        proxy_pass http://z_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Кэш статики Next (отдаёт контейнер, но заголовки можно усилить на nginx).
    location /_next/static/ {
        proxy_pass http://z_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
