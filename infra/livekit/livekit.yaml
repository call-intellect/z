# Локальная конфигурация LiveKit Server для dev.
# В prod конфиг едет на vm-livekit (см. plans/tz/2026-05-06-infrastructure-deployment-tz.md).

port: 7880
bind_addresses:
  - '0.0.0.0'

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: false

redis:
  address: 127.0.0.1:6379

keys:
  # Локальный API-ключ; должен совпадать с LIVEKIT_API_KEY в backend/.env
  devkey: secretsecretsecretsecretsecretsecretsecretsecret

webhook:
  api_key: devkey
  urls:
    - 'http://host.docker.internal:3000/webhooks/livekit'

room:
  empty_timeout: 600
  max_participants: 10
  enabled_codecs:
    - mime: audio/opus
    - mime: video/vp8
    - mime: video/h264

turn:
  enabled: true
  domain: localhost
  tls_port: 5349
  udp_port: 3478

logging:
  level: info
  json: false
