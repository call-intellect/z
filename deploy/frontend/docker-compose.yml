# Z frontend — production docker compose.
#
# Фронт (Next.js output:'standalone') запускается КОНТЕЙНЕРОМ (bun server.js),
# слушает только 127.0.0.1:${FRONTEND_PORT} — наружу публикует nginx на хост-машине
# (deploy/nginx/z-frontend.conf проксирует на этот порт).
#
# Запуск (из deploy/frontend/):
#   cp frontend.env.example frontend.env   # заполнить NEXT_PUBLIC_* и FRONTEND_PORT
#   docker compose --env-file frontend.env up -d --build
#
# ВАЖНО: NEXT_PUBLIC_* вшиваются в бандл на СБОРКЕ (build-args). При смене URL — пересобрать
#   docker compose --env-file frontend.env up -d --build

name: z-frontend

services:
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?required}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?required}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:?required}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-}
    image: z-frontend:latest
    container_name: z-frontend
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: '0.0.0.0'
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3001}:3001'
    restart: unless-stopped
