# RBAC модель Z (формат Casbin для будущей миграции).
#
# Сущности:
#   sub  — субъект: User.id (или 'super_admin' / 'owner' / 'admin' / 'manager' как роль)
#   obj  — ресурс: 'org' | 'meeting' | 'card' | 'task' | 'chapter' | 'highlight' |
#                  'chat-message' | 'tag' | 'audit-log' | 'ai-usage'
#   act  — действие: 'read' | 'write' | 'delete' | 'manage'
#   tenant   — id Org, в контексте которой проверка
#   visibility — 'open' | 'strict' (Org.visibilityMode на момент проверки)
#   ownerId  — User.id владельца ресурса (или строка 'shared' для общих ресурсов)
#
# Пока — реализуем как код в RbacService.evaluate(). Файл здесь — для версионирования
# модели и путь миграции на Casbin (FileAdapter / Postgres adapter).

[request_definition]
r = sub, role, tenant_visibility, resource_owner_id, obj, act

[policy_definition]
p = role, visibility, owner_match, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# super_admin — bypass всех проверок (см. RbacService).
# owner/admin — read/write на всё в Org.
# manager + open visibility — read на всё в Org, write только своих.
# manager + strict visibility — read/write только своих.
m = (r.role == p.role) && (p.visibility == "*" || p.visibility == r.tenant_visibility) && (p.owner_match == "*" || p.owner_match == "self") && r.obj == p.obj && r.act == p.act
