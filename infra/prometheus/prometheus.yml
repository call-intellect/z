# Prometheus scrape config для Z (prod).
# Деплоится на vm-monitoring. Алерты — в `infra/grafana/alerts/*.yml`,
# мапим их через `rule_files` ниже.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    monitor: z-prod

rule_files:
  - /etc/prometheus/alerts/*.yml

# Alertmanager — отдельный сервис (vm-monitoring:9093).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # NestJS-бэкенд: бизнес-метрики + дефолтный prom-client.
  - job_name: z-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['z-backend:3000']
        labels:
          service: backend

  # LiveKit Server (отдаёт `livekit_room_total`, `livekit_participant_total`, ...).
  - job_name: z-livekit
    metrics_path: /metrics
    static_configs:
      - targets: ['z-livekit:6789']
        labels:
          service: livekit

  # LiveKit Egress (отдаёт состояние запущенных композиций).
  - job_name: z-egress
    metrics_path: /metrics
    static_configs:
      - targets: ['z-egress:6790']
        labels:
          service: egress

  # postgres_exporter (https://github.com/prometheus-community/postgres_exporter)
  - job_name: postgres-exporter
    static_configs:
      - targets: ['postgres-exporter:9187']

  # redis_exporter (https://github.com/oliver006/redis_exporter)
  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']

  # node_exporter (host metrics на каждой VM).
  - job_name: node-exporter
    static_configs:
      - targets:
          - 'vm-backend:9100'
          - 'vm-livekit:9100'
          - 'vm-egress:9100'
          - 'vm-system-b:9100'

  # Сам Prometheus.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
