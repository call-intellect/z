# Z LiveKit signaling — nginx на ХОСТ-машине. Терминирует TLS для
# wss://media.example.com и проксирует на LiveKit Server (host network, :7880).
#
# ВАЖНО: через nginx идёт ТОЛЬКО signaling (WebSocket) + HTTP. Медиа (WebRTC,
# UDP 50000-60000) и TURN (5349/3478) идут НАПРЯМУЮ на хост, минуя nginx —
# открой эти порты в фаерволе.
#
# Установка:
#   sudo cp deploy/nginx/z-livekit.conf /etc/nginx/sites-available/z-livekit.conf
#   sudo ln -s /etc/nginx/sites-available/z-livekit.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d media.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ Замени media.example.com. Порт 7880 = livekit.yaml `port`.

upstream z_livekit {
    server 127.0.0.1:7880;
}

server {
    listen 80;
    listen [::]:80;
    server_name media.example.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.example.com;

    # --- TLS (заполняется certbot) ---
    # ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://z_livekit;
        proxy_http_version 1.1;
        # WebSocket upgrade — обязателен для signaling LiveKit.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
