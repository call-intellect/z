# Smoke-test docker-compose for Phase 0 of document-ingest.
# Runs once, prints results table, exits.
#
# Usage:
#   docker compose build
#   docker compose run --rm smoke 2>&1 | tee results/smoke.log
#
# In parallel terminal (for RAM peak):
#   docker stats docling-smoke --no-stream --format 'table {{.Container}}\t{{.MemUsage}}'

services:
  smoke:
    build: .
    image: docling-smoke
    # `docker compose run` creates a per-invocation container name, so the
    # canonical name "docling-smoke" is only attached via `docker compose up`.
    # For docker stats observability use:
    #   docker compose up smoke
    # or run smoke via `docker run --rm --name docling-smoke docling-smoke`.
    container_name: docling-smoke
    mem_limit: 4g
    # Fixtures mounted RO; results writable.
    volumes:
      - ../../../backend/test/fixtures/documents:/work/fixtures:ro
      - ./results:/work/results
    # Network: enabled for first run so RapidOCR can fetch models from modelscope.cn
    # if pre-bake in Dockerfile failed. After successful prefetch you can re-enable
    # `network_mode: none` for fully-offline smoke.
    # network_mode: none
    # Reduce torch thread contention on 4-core CPU.
    environment:
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - TOKENIZERS_PARALLELISM=false
