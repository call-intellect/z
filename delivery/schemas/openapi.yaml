openapi: 3.1.0
info:
  title: Второй мозг компании — REST API
  version: 1.0.0
  description: |
    Полная API-спецификация. Машиночитаемый источник.
    Текстовое описание endpoint-ов — в delivery/04-api-spec.md.
servers:
  - url: https://{tenant}.example.ru/api/v1
    description: Tenant API
    variables:
      tenant:
        default: company
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ConfirmationLevel:
      type: string
      enum: [proposed, analyzed, confirmed, locked, archived]
    DataClass:
      type: string
      enum: [public, internal, sensitive, private]
    SignalType:
      type: string
      enum:
        - client_pain
        - feature_request
        - objection
        - churn_risk
        - idea
        - risk
        - commitment
        - decision
        - mood
        - drift
        - competitor_move
        - metric_change
        - knowledge_gap
    RelationType:
      type: string
      enum:
        - подтверждает
        - противоречит
        - мешает
        - помогает
        - вызывает
        - относится_к_цели
        - упоминает_человека
        - упоминает_клиента
        - повторяет
        - стратегическое_расхождение
        - ранний_симптом_риска
        - новая_сторона_старой_проблемы
        - общий_корень_нескольких_проблем
    Evidence:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        snippet:
          type: string
        weight:
          type: number
        occurred_at:
          type: string
          format: date-time
    RawEvent:
      type: object
      required: [id, source_id, occurred_at, content_type, data_class]
      properties:
        id:
          type: string
        source_id:
          type: string
        external_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        author_ref:
          type: object
        channel_ref:
          type: object
        content_type:
          type: string
        body_text:
          type: string
        minio_key:
          type: string
        data_class:
          $ref: '#/components/schemas/DataClass'
    Signal:
      type: object
      properties:
        id:
          type: string
        signal_type:
          $ref: '#/components/schemas/SignalType'
        text:
          type: string
        confidence:
          type: number
        importance:
          type: string
          enum: [low, medium, high, critical]
        emotion:
          type: string
          enum: [positive, neutral, negative, mixed]
        confirmation:
          $ref: '#/components/schemas/ConfirmationLevel'
        theme_id:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
    Theme:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        branch_id:
          type: string
        weight:
          type: number
        status:
          type: string
          enum: [emerging, active, declining, archived]
        confirmation:
          $ref: '#/components/schemas/ConfirmationLevel'
    Goal:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [north_star, quarterly, monthly, anti_goal, positioning]
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, paused, achieved, abandoned]
    AlignmentSnapshot:
      type: object
      properties:
        score:
          type: integer
        submetrics:
          type: object
          properties:
            voices_alignment:
              type: integer
            actions_to_goals:
              type: integer
            drift_velocity:
              type: integer
        computed_at:
          type: string
          format: date-time
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        role:
          type: string
          enum: [user, agent, system]
        content:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        agent_id:
          type: string
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

paths:
  /auth/login:
    post:
      summary: Логин
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200': {description: OK}

  /auth/me:
    get:
      summary: Текущий пользователь
      responses:
        '200': {description: OK}

  /ingest/event:
    post:
      summary: Создать RawEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawEvent'
      responses:
        '201': {description: Created}
        '409': {description: Idempotency conflict}

  /ingest/file:
    post:
      summary: Загрузить файл
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary

  /signals:
    get:
      summary: Список сигналов
      parameters:
        - in: query
          name: signal_type
          schema:
            $ref: '#/components/schemas/SignalType'
        - in: query
          name: theme_id
          schema: {type: string}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, default: 50, maximum: 200}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Signal'}
                  next_cursor:
                    type: string

  /signals/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200': {description: OK}
        '403': {description: Access denied}
        '404': {description: Not found}

  /themes:
    get:
      summary: Список тем
      responses:
        '200': {description: OK}

  /themes/{id}:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200': {description: OK}

  /graph/nodes/{id}/neighbors:
    get:
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
        - in: query
          name: depth
          schema: {type: integer, default: 1, maximum: 3}
      responses:
        '200': {description: OK}

  /goals:
    get:
      responses:
        '200': {description: OK}
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Goal'
      responses:
        '201': {description: Created}

  /alignment/current:
    get:
      summary: Текущая согласованность стратегии
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlignmentSnapshot'

  /chat/messages:
    post:
      summary: Отправить сообщение в чат (REST, не streaming)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id: {type: string}
                content: {type: string}
                voice: {type: boolean}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'

  /commitments:
    get:
      summary: Свои обещания
      parameters:
        - in: query
          name: person_id
          schema: {type: string}
        - in: query
          name: status
          schema: {type: string, enum: [mentioned, acknowledged, mentioned_done, forgotten]}
      responses:
        '200': {description: OK}

  /admin/persons/{user_id}/forget:
    post:
      summary: Запустить compliance-удаление
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: string}
      responses:
        '202': {description: Accepted, deletion in 30 days}

  /admin/persons/{user_id}/export:
    get:
      summary: Экспорт всех данных о субъекте
      parameters:
        - in: path
          name: user_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: OK}

# ВНИМАНИЕ: это сокращённая спека. Полная спека — после генерации из кода
# через FastAPI auto-OpenAPI. Сохраняется в этом же файле + версионируется.
