# Z — production docker compose (единый, без профилей).
#
# Поднимает весь backend-стек одной командой:
#   cp .env.example .env        # заполнить секреты и порты
#   docker compose up -d --build backend
#
# Состав:
#   postgres  — PostgreSQL 17 + pgvector (внутренняя сеть)
#   redis     — Redis 8 (BullMQ-очереди, AOF)
#   migrate   — one-shot: prisma db push + pgvector-индексы (HNSW/GIN); запускается ДО backend
#   backend   — NestJS HTTP API + воркеры BullMQ in-process
#   frontend  — Next.js (output: standalone), bun server.js
#
# Порты — через .env (см. .env.example):
#   BACKEND_HOST_PORT  → публикация backend на 127.0.0.1 (nginx проксирует сюда)
#   PORT               → порт, который слушает backend ВНУТРИ контейнера
#   FRONTEND_HOST_PORT → публикация frontend на 127.0.0.1
#   FRONTEND_PORT      → порт frontend ВНУТРИ контейнера
#
# Backend и frontend слушают только на 127.0.0.1 — наружу публикует nginx на хосте
# (см. deploy/nginx/*.conf). LiveKit/Egress — отдельный compose (см. infra/livekit/).
#
# Команды:
#   docker compose up -d --build backend     # только backend-стек (+ его зависимости)
#   docker compose up -d --build frontend    # только frontend
#   docker compose up -d --build             # всё сразу
#   docker compose logs -f backend
#   docker compose down

name: z

# Единая сборка образа z-backend:latest — переиспользуют migrate и backend.
# HTTP(S)_PROXY — опциональный прокси для загрузки пакетов на этапе сборки
# (apk + bun install). Это «предопределённые» build-args Docker: применяются к RUN
# и НЕ остаются в финальном образе (рантайм приложения через прокси НЕ идёт).
x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  args:
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}

services:
  postgres:
    # Composite-образ PG16 + pgvector + Apache AGE (см. infra/postgres/Dockerfile).
    # Оба расширения нужны в одной БД:
    #   - pgvector — для embedding'ов IdeaBlock/Entity/MeetingTranscriptChunk.
    #   - apache/age — для графовой инфраструктуры Фазы 0 (см.
    #     plans/tz/2026-05-21-phase-0a-data-model-and-graph-infra.md §5).
    # На prod (Yandex Managed PostgreSQL 16) образ не нужен — оба расширения
    # доступны как managed extensions (см.
    # second-brain/02_architecture/age-deployment-decision.md).
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile
    image: z-postgres-age-pgvector:pg16
    container_name: z-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-z_main}
      POSTGRES_USER: ${POSTGRES_USER:-z_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен в .env}
    volumes:
      - z-postgres-data:/var/lib/postgresql/data
    # Опционально (отладка с хоста): раскомментируй и задай POSTGRES_HOST_PORT в .env.
    # ports:
    #   - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-z_app} -d ${POSTGRES_DB:-z_main}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [z-internal]

  redis:
    image: redis:8-alpine
    container_name: z-redis
    restart: unless-stopped
    # appendonly yes — BullMQ-очереди переживают рестарт redis.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - z-redis-data:/data
    # Опционально (отладка с хоста): раскомментируй и задай REDIS_HOST_PORT в .env.
    # ports:
    #   - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [z-internal]

  # One-shot: схема (prisma db push) + pgvector-индексы (postgres-init.sql).
  # backend стартует только после успешного завершения миграции.
  migrate:
    image: z-backend:latest
    build: *backend-build
    container_name: z-migrate
    env_file: [.env]
    # Полный выкат одной командой: авто-бэкап (pg_dump → z-backups) → dedupe →
    # prisma db push --accept-data-loss → apply-postgres-init → seed/patch/backfill.
    # --no-fail-on-steps: сбой схемы (бэкап/push) валит migrate и блокирует backend
    # (это правильно), а осечка идемпотентного seed/backfill — НЕ блокирует стек
    # (смотри `docker compose logs migrate`, перезапусти упавшие скрипты руками).
    command:
      - bun
      - run
      - scripts/apply-prod-deploy.ts
      - --mode
      - update
      - --with-schema
      - --continue-on-fail
      - --no-fail-on-steps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'
    # z-backups — pg_dump перед --accept-data-loss (тот же volume, что у backend).
    volumes:
      - z-backups:/app/backups
    networks: [z-internal]

  # GEPA prompt evolution (Agents v2 Фаза C2) — отдельный Python-сервис.
  # Раньше Python вшивался в образ backend и запускался через child_process.spawn;
  # вынесен в свой контейнер ради лёгкого образа backend, изоляции ML-зависимостей
  # и атомарной сборки. Backend ходит сюда по HTTP (GEPA_SERVICE_URL=http://gepa:8000).
  # env_file: [.env] — нужны те же LLM-креды (litellm/deepseek), что раньше
  # subprocess наследовал от backend. Наружу порт не публикуем — только z-internal.
  gepa:
    image: z-gepa:latest
    build:
      context: ./backend/python
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: z-gepa
    env_file: [.env]
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [z-internal]

  backend:
    image: z-backend:latest
    build: *backend-build
    container_name: z-backend
    env_file: [.env]
    environment:
      # PORT берётся из .env; дублируем дефолт на случай отсутствия.
      PORT: ${PORT:-3000}
    ports:
      - '127.0.0.1:${BACKEND_HOST_PORT:-3000}:${PORT:-3000}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    # z-backups — авто-бэкапы БД от apply-prod-deploy.ts --with-schema (pg_dump
    # перед --accept-data-loss). Лежат в docker-volume, переживают пересборку.
    volumes:
      - z-backups:/app/backups
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:${PORT:-3000}/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [z-internal]

  frontend:
    image: z-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      # NEXT_PUBLIC_* инлайнятся в бандл во время СБОРКИ (build-args).
      # При смене URL — пересобрать: docker compose up -d --build frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?required}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?required}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:?required}
        NEXT_PUBLIC_FRONTEND_URL: ${NEXT_PUBLIC_FRONTEND_URL:-}
        # Прокси для загрузки пакетов на сборке (см. комментарий выше у backend).
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    container_name: z-frontend
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_PORT:-3001}
      HOSTNAME: '0.0.0.0'
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:${FRONTEND_HOST_PORT:-3001}:${FRONTEND_PORT:-3001}'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:${FRONTEND_PORT:-3001}']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  z-postgres-data:
  z-redis-data:
  z-backups:

networks:
  z-internal:
    driver: bridge
