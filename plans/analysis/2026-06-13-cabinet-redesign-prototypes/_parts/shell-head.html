<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кора — прототип кабинета (редизайн 2026-06-13)</title>
<link rel="stylesheet" href="design-system.css">
<style>
  .screen { display: none; }
  .screen.active { display: block; }
  .role-switch { position: fixed; right: 18px; bottom: 18px; z-index: 50; display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: oklch(0.16 0.03 280 / 0.9); border: 1px solid oklch(1 0 0 / 0.1); backdrop-filter: blur(14px); box-shadow: 0 18px 40px -18px oklch(0 0 0 / 0.8); }
  .role-switch button { padding: 7px 14px; border-radius: 999px; border: none; background: none; color: var(--dim); font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: var(--font); }
  .role-switch button.active { background: var(--grad-violet); color: var(--text); }
  [data-role-only] { display: none; }
</style>
</head>
<body data-role="owner">
<div class="app">
  <!-- ===================== САЙДБАР (новое меню §1.1) ===================== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">К</div>
      <div>
        <div class="brand-name">Кора</div>
        <div class="brand-sub">ООО «Луа»</div>
      </div>
    </div>

    <!-- РИТМЫ (owner/admin/coo) -->
    <div class="nav-group" data-role-show="owner,coo">
      <div class="nav-group-label">Ритмы</div>
      <a class="nav-item active" data-goto="today">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        Сегодня</a>
      <a class="nav-item" data-goto="week">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Неделя</a>
      <a class="nav-item" data-goto="month" data-role-show="owner">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v8l3-3M12 10l-3-3"/><circle cx="12" cy="15" r="7"/></svg>
        Итоги месяца</a>
    </div>

    <!-- МОЁ (member) -->
    <div class="nav-group" data-role-show="member">
      <div class="nav-group-label">Моё</div>
      <a class="nav-item" data-goto="me">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        Сегодня</a>
    </div>

    <!-- РАБОТА -->
    <div class="nav-group">
      <div class="nav-group-label">Работа</div>
      <a class="nav-item" data-goto="meetings">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l4.5-2.5v9L15 14M3 7h12v10H3z"/></svg>
        Встречи</a>
      <a class="nav-item" data-goto="tasks">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 8v8M15 8v5"/></svg>
        Задачи</a>
      <a class="nav-item" data-goto="memory">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a4 4 0 0 0-4 4v1a3 3 0 0 0 0 6 3 3 0 0 0 4 3 3 3 0 0 0 4-3 3 3 0 0 0 0-6V7a4 4 0 0 0-4-4z"/></svg>
        Память</a>
      <a class="nav-item" data-goto="team" data-role-show="owner,coo">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 20a6 6 0 0 1 12 0M15 20a5 5 0 0 1 6 0"/></svg>
        Команда</a>
      <a class="nav-item" data-goto="me" data-role-show="member">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Мои дела</a>
    </div>

    <!-- ЛИЧНОЕ (owner) -->
    <div class="nav-group" data-role-show="owner,coo">
      <div class="nav-group-label">Личное</div>
      <a class="nav-item" data-goto="me">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        Я</a>
    </div>

    <!-- СИСТЕМА -->
    <div class="nav-group">
      <div class="nav-group-label">Система</div>
      <a class="nav-item" data-goto="settings">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
        Настройки</a>
    </div>

    <div style="margin-top:auto; padding:12px 8px 4px; display:flex; align-items:center; gap:10px;">
      <div class="avatar" style="background:var(--grad-violet); width:34px; height:34px;">С</div>
      <div style="min-width:0;">
        <div style="font-size:13px; font-weight:600;">Сергей</div>
        <div class="faint" style="font-size:11px;">Владелец</div>
      </div>
    </div>
  </aside>

  <!-- ===================== ОСНОВНАЯ ОБЛАСТЬ ===================== -->
  <main class="main">
    <div class="page">
      <!-- топ-бар (общий) -->
      <div class="topbar">
        <div class="topbar-left">
          <h1 id="page-title">Сегодня</h1>
          <span class="topbar-sub" id="page-sub">Понедельник, 13 июня · ООО «Луа»</span>
        </div>
        <div class="topbar-right">
          <div class="search-pill">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            Поиск
          </div>
          <button class="create-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
            Создать
          </button>
          <button class="requires-btn" data-goto="requires">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 0 0-7 7c0 5-2 6-2 6h18s-2-1-2-6a7 7 0 0 0-7-7z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
            Требует вас <span class="n">6</span>
          </button>
          <button class="avatar-btn"></button>
        </div>
      </div>

      <!-- ===================== ЭКРАНЫ ===================== -->
