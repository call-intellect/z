# LiteLLM configuration — пример для production self-host инсталляции
# Путь применения: liteellm proxy --config /etc/litellm/config.yaml
# Полное описание маршрутизации — в delivery/07-ai-team.md

litellm_settings:
  # Cache
  cache:
    type: redis
    host: valkey
    port: 6379
    password: os.environ/VALKEY_PASSWORD
    ttl: 86400  # 24 часа

  # Audit
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

  langfuse_public_key: os.environ/LANGFUSE_PUBLIC_KEY
  langfuse_secret_key: os.environ/LANGFUSE_SECRET_KEY
  langfuse_host: http://langfuse:3000

  # Бюджет
  max_budget: 100000  # ₽ в месяц на тенант, override через admin API

# =================================================================
# MODEL LIST
# =================================================================
model_list:
  # ----- Smart default (high-quality, для главного analysis-loop) -----
  - model_name: smart-default
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 4096
      temperature: 0.2
    model_info:
      tier: smart
      data_class_max: internal

  - model_name: smart-default
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      max_tokens: 4096
    model_info:
      tier: smart
      data_class_max: internal

  - model_name: smart-default
    litellm_params:
      model: gemini/gemini-2.0-pro
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      tier: smart
      data_class_max: internal

  # ----- Fast default (для классификаторов, theme matcher) -----
  - model_name: fast-default
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: fast-default
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: fast-default
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

  # ----- Vision -----
  - model_name: vision-default
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: vision-default
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # ----- Local smart (для sensitive/private) -----
  - model_name: smart-local
    litellm_params:
      model: openai/qwen2.5-72b-instruct
      api_base: http://vllm:8000/v1
      api_key: dummy
    model_info:
      tier: smart
      data_class_max: private

  - model_name: smart-local
    litellm_params:
      model: openai/llama-3.3-70b-instruct
      api_base: http://vllm-llama:8001/v1
      api_key: dummy
    model_info:
      tier: smart
      data_class_max: private

  # ----- Fast local -----
  - model_name: fast-local
    litellm_params:
      model: ollama/qwen2.5:7b-instruct
      api_base: http://ollama:11434

  # ----- Embeddings (всегда локальные) -----
  - model_name: embeddings-local
    litellm_params:
      model: huggingface/BAAI/bge-m3
      api_base: http://embedding-service:8000

  # ----- Rerank (cross-encoder, всегда локальные) -----
  - model_name: rerank-local
    litellm_params:
      model: huggingface/BAAI/bge-reranker-v2-m3
      api_base: http://rerank-service:8000

# =================================================================
# ROUTER
# =================================================================
router_settings:
  routing_strategy: latency-based-routing
  num_retries: 3
  retry_after: 5
  timeout: 30
  redis_host: valkey
  redis_port: 6379

  fallbacks:
    - smart-default: [smart-local]
    - fast-default: [fast-local, smart-local]
    - vision-default: [smart-local]

  # Не разрешаем cloud для sensitive
  context_window_fallbacks:
    - smart-default: [smart-local]

# =================================================================
# DATA-CLASS POLICIES (custom middleware)
# =================================================================
# Эти политики применяются нашим custom middleware ПЕРЕД LiteLLM.
# LiteLLM сам не знает про data_class — middleware подставляет model_name
# в зависимости от data_class запроса.

# data_class -> допустимые model_name groups
data_class_routing:
  public:
    primary: [smart-default, fast-default]
    fallback: [smart-local]
  internal:
    primary: [smart-default, fast-default]
    fallback: [smart-local]
  sensitive:
    primary: [smart-local]
    fallback: [smart-local]   # никаких внешних
  private:
    primary: [smart-local]
    fallback: [smart-local]

# =================================================================
# AUTH между сервисами и LiteLLM
# =================================================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL  # для logging + budget
  ui_username: admin
  ui_password: os.environ/LITELLM_UI_PASSWORD
