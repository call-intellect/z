# =================================================================
# Второй мозг для компаний — пример docker-compose для single-node
# Версия: 1.0
# Дата: 2026-05-10
# =================================================================
# Это пример конфигурации. Фактическая конфигурация в репо deploy/compose/.
# Production-настройки — через .env + secrets из OpenBao.
# =================================================================

version: '3.9'

services:
  # ====================================================
  # Reverse proxy + TLS
  # ====================================================
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [front-net, app-net]

  # ====================================================
  # Identity Provider
  # ====================================================
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_PROXY: edge
    secrets: [keycloak_db_password]
    depends_on: [postgres]
    networks: [app-net]

  # ====================================================
  # Application services (примеры)
  # ====================================================
  api-gateway:
    image: harbor.local/secondbrain/api-gateway:1.0.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@postgres:5432/secondbrain
      KAFKA_BROKERS: kafka:9092
      VALKEY_URL: redis://valkey:6379
      OPENFGA_URL: http://openfga:8080
      LITELLM_URL: http://litellm:4000
      LANGFUSE_HOST: http://langfuse:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    networks: [app-net, data-net]
    depends_on: [postgres, kafka, valkey, openfga]

  ingest-api:
    image: harbor.local/secondbrain/ingest-api:1.0.0
    restart: unless-stopped
    environment:
      <<: *app-env  # тот же набор env
    networks: [app-net, data-net]

  whisper-service:
    image: harbor.local/secondbrain/whisper:1.0.0
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [app-net]

  m05-analyzer: { image: harbor.local/secondbrain/m05-analyzer:1.0.0, networks: [app-net, data-net] }
  m11-linker:   { image: harbor.local/secondbrain/m11-linker:1.0.0, networks: [app-net, data-net] }
  m13-consolidator: { image: harbor.local/secondbrain/m13-consolidator:1.0.0, networks: [app-net, data-net] }
  m14-reframer: { image: harbor.local/secondbrain/m14-reframer:1.0.0, networks: [app-net, data-net] }
  m16-alignment: { image: harbor.local/secondbrain/m16-alignment:1.0.0, networks: [app-net, data-net] }
  m19-mood: { image: harbor.local/secondbrain/m19-mood:1.0.0, networks: [app-net, data-net] }
  m22-metrics: { image: harbor.local/secondbrain/m22-metrics:1.0.0, networks: [app-net, data-net] }
  m23-query-agent: { image: harbor.local/secondbrain/m23-query-agent:1.0.0, networks: [app-net, data-net] }
  m38-supervisor: { image: harbor.local/secondbrain/m38-supervisor:1.0.0, networks: [app-net, data-net] }

  outbox-publisher: { image: harbor.local/secondbrain/outbox:1.0.0, networks: [app-net, data-net] }

  embedding-service:
    image: harbor.local/secondbrain/embedding:1.0.0   # bge-m3
    networks: [app-net]
  rerank-service:
    image: harbor.local/secondbrain/rerank:1.0.0     # bge-reranker-v2-m3
    networks: [app-net]

  # ====================================================
  # LLM stack
  # ====================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    volumes:
      - ./litellm-config.yaml:/etc/litellm/config.yaml:ro
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks: [app-net]

  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    profiles: ["with-gpu"]
    command: >
      --model Qwen/Qwen2.5-72B-Instruct
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.9
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [app-net]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["lightweight"]
    volumes:
      - ollama-data:/root/.ollama
    networks: [app-net]

  # ====================================================
  # Storage
  # ====================================================
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: secondbrain
      POSTGRES_USER: app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets: [postgres_app_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks: [data-net]

  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    volumes:
      - falkordb-data:/data
    networks: [data-net]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch-data:/meili_data
    networks: [data-net]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [data-net]

  valkey:
    image: valkey/valkey:7-alpine
    restart: unless-stopped
    command: valkey-server --requirepass ${VALKEY_PASSWORD} --save 60 1
    volumes:
      - valkey-data:/data
    networks: [data-net]

  # ====================================================
  # Event bus & workflows
  # ====================================================
  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    volumes:
      - kafka-data:/bitnami/kafka
    networks: [data-net]

  temporal:
    image: temporalio/auto-setup:1.25
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
    depends_on: [postgres]
    networks: [data-net, app-net]

  # ====================================================
  # RBAC & secrets
  # ====================================================
  openfga:
    image: openfga/openfga:latest
    restart: unless-stopped
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga
    networks: [app-net, data-net]

  openbao:
    image: openbao/openbao:latest
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    volumes:
      - openbao-data:/openbao/file
    networks: [app-net]

  # ====================================================
  # Observability
  # ====================================================
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [obs-net, app-net, data-net]

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks: [obs-net]

  tempo:
    image: grafana/tempo:latest
    restart: unless-stopped
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [obs-net]

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    networks: [obs-net, app-net]

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [obs-net]

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_URL}
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET}
    networks: [obs-net, app-net, data-net]

  glitchtip:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD}@postgres:5432/glitchtip
    networks: [obs-net]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    networks: [obs-net, app-net]

  # ====================================================
  # Frontend
  # ====================================================
  frontend:
    image: harbor.local/secondbrain/frontend:1.0.0
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
    networks: [app-net]

  telegram-bot:
    image: harbor.local/secondbrain/telegram-bot:1.0.0
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN_FILE: /run/secrets/telegram_token
    secrets: [telegram_token]
    networks: [app-net]


# =================================================================
networks:
  front-net:
    driver: bridge
  app-net:
    driver: bridge
    internal: false
  data-net:
    driver: bridge
    internal: true
  obs-net:
    driver: bridge


volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  falkordb-data:
  meilisearch-data:
  minio-data:
  valkey-data:
  kafka-data:
  ollama-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
  openbao-data:


secrets:
  postgres_app_password:
    file: ./secrets/postgres_app_password
  keycloak_db_password:
    file: ./secrets/keycloak_db_password
  telegram_token:
    file: ./secrets/telegram_token
